name: Chokkhu CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: CI on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.8", "3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements_dev.txt
          python -m pip install -e .

      - name: Run Code Formatting Checks (Black & isort)
        run: |
          python -m black --check src
          python -m isort --check-only src

      - name: Run Linting (flake8)
        run: python -m flake8 src tests

      - name: Run Type Checking (mypy)
        run: python -m mypy src --follow-imports=skip

      - name: Run Unit & Integration Tests (pytest)
        run: python -m pytest tests/ -v -s
