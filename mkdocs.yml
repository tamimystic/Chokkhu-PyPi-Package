site_name: Chokkhu Documentation
site_description: A Complete High-Performance Machine Learning Toolkit
site_author: tamimystic
repo_name: tamimystic/chokkhu
repo_url: https://github.com/tamimystic/chokkhu

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html

plugins:
  - search

nav:
  - Home: index.md
  - Getting Started: getting_started.md
  - API Reference:
    - Load (Data I/O): api/load.md
    - Exploratory Data Analysis: api/eda.md
    - Data Cleaning: api/clean.md
    - Preprocessing: api/preprocess.md
    - Transformation: api/transform.md
    - Data Splitting: api/split.md
    - Model Training: api/train.md
    - Model Evaluation: api/evaluate.md
  - Examples:
    - Tabular Pipeline: examples/tabular.md
    - Image Pipeline: examples/image.md
