[flake8]
max-line-length = 160
extend-ignore = E203, W503
exclude =
    __init__.py
    build
    dist


[mypy]
mypy_path = src
ignore_missing_imports = True
follow_imports = skip
strict_optional = False
disallow_untyped_defs = False
check_untyped_defs = False
warn_return_any = False
warn_unused_ignores = False
